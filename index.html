<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanteenLive — Know before you queue</title>
  <meta name="description" content="CanteenLive: Know before you queue. Order before it's gone. Live canteen stock, pickup time slots and pre-order tokens for students and canteen owners.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <div class="hero">
      <div class="logo" aria-hidden="true">🍛</div>
      <h1>CanteenLive</h1>
      <p>Know before you queue. Order before it&rsquo;s gone.</p>
    </div>

    <div class="role-grid">
      <a class="role-btn uncle" href="uncle.html" aria-label="Open Uncle mode — canteen owner">
        <span class="icon" aria-hidden="true">👨‍🍳</span>
        Uncle
        <small>I run the canteen</small>
      </a>
      <a class="role-btn student" href="student.html" aria-label="Open Student mode — pre-order food">
        <span class="icon" aria-hidden="true">🎒</span>
        Student
        <small>I want to pre-order</small>
      </a>
    </div>
  </main>

  <!-- store.js pre-loads the 3 sample items on first visit, from any page -->
  <script src="store.js"></script>
</body>
</html>
